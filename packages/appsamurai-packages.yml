  organization (Netvent is AppSamurai's parent/engineering org). These are
  mobile ad / attribution / stories SDKs for integrating AppSamurai and its
  Storyly and Interceptd products into apps — not clients for the Campaign
  Spend reporting API, which is a keyed HTTP GET with no published SDK.
