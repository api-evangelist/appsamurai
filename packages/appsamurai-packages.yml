docs: https://docs.storyly.io/docs
notes: >-
  Every first-party client library App Samurai ships is a MOBILE/WEB EMBED SDK,
  not a client for either of its two REST APIs. The Storyly External API (18
  operations, api.storyly.io) and the AppSamurai Campaign Spend API (1 GET) both
  ship with no SDK in any language.
  Currency is the story here and it splits cleanly in two. The Storyly Placement
  line (1.x) is shipping continuously - Android, iOS, Web, React Native and
  Flutter all published within the last week. The AppSamurai advertising and
  attribution line is cold: react-native-appsamurai-ads last published 0.1.0 in
  August 2019, the attribution bridge in November 2019, and the Android/iOS ad
  SDK repos have not been pushed since 2019/2021. A first-party SDK seven years
  stale is the clearest decay signal on this provider.
  Publisher note: the npm accounts are `storyly` and `appsamuraiinc`, and every
  repository link resolves into github.com/Netvent - App Samurai's engineering
  org - which is what establishes these as first-party.

