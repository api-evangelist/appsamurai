recommendation_for_provider: >-
  Publishing RFC 9331-style RateLimit-Limit / RateLimit-Remaining / RateLimit-Reset
  headers, and documenting the 429 response, would cost one middleware and is the
  single change that would most improve automated-client behaviour against
  api.storyly.io.
