generated: '2026-08-13'
method: probed
source: >-
  live requests to https://api.storyly.io/external/app and
  https://api.appsamurai.com/ (2026-08-13); docs.storyly.io/llms.txt index and
  https://help.appsamurai.com/en/articles/11105087-appsamurai-campaign-spend-api
notes: >-
  App Samurai publishes no rate limits for either API, and neither returns a
  rate-limit signal an agent could read. The full response header set from
  api.storyly.io on an unauthenticated call carried only date, content-type,
  content-length and the four CORS headers - no X-RateLimit-*, no RateLimit-*,
  no Retry-After. The Storyly docs index (35 guides and the External API
  reference) contains no rate-limit page. api.appsamurai.com answered 500 on
  every path, so nothing could be observed there at all.
  An honest zero: the limits may exist server-side, but they are invisible to
  the client, which means a well-behaved integration cannot back off correctly.

limit_count: 0

