    post:
      tags:
      - story
      summary: Create story
      description: Create a new story.
      operationId: createStory
      security:
      - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                deep_link:
                  description: Optional - Deep link URL
                  type: string
                  example: storyly://story/123
                file:
                  description: Optional - Story media file
                  type: string
                  format: binary
                media_url:
                  description: Optional - Media URL
                  type: string
                  example: https://example.com/story-media.mp4
                name:
                  description: Optional - Story name (max 255 chars)
                  type: string
                  example: story-name
                sort_order:
                  description: Optional - Sort order (integer)
                  type: string
                  example: '1'
                status:
                  description: Required - Story status (integer)
                  type: string
                  example: '1'
                story_group_id:
                  description: Required - Story group ID (integer)
                  type: string
                  example: '204206'
                title:
                  description: Required - Story title (max 255 chars)
                  type: string
                  example: My Story
                ts_end:
                  description: Optional - End timestamp
                  type: string
                  example: '2024-04-20T00:00:00Z'
                ts_start:
                  description: Optional - Start timestamp
                  type: string
                  example: '2024-03-20T00:00:00Z'
                type:
                  description: Required - Story type (integer)
                  type: string
                  example: '1'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Story successfully created
                  status:
                    type: string
                    example: ok
              examples:
                '200':
                  value:
                    message: Story successfully created
                    status: ok
    delete:
      tags:
      - story
      summary: Delete story
      description: Delete a story by ID.
      operationId: deleteStory
      security:
      - bearerAuth: []
      parameters:
      - name: story_id
        in: query
        schema:
          type: string
          example: '2581651'
        description: required=True, min_value=1
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Story successfully deleted
                  status:
                    type: string
                    example: ok
              examples:
                '200':
                  value:
                    message: Story successfully deleted
                    status: ok
    patch:
      tags:
      - story
      summary: Update story
      description: Update an existing story.
      operationId: updateStory
      security:
      - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                deep_link:
                  description: Optional - New deep link URL
                  type: string
                  example: storyly://story/456
                file:
                  description: Optional - New story media file
                  type: string
                  format: binary
                id:
                  description: Required - Story ID (integer)
                  type: string
                  example: '2581651'
                media_url:
                  description: Optional - New media URL
                  type: string
                  example: https://example.com/updated-story-media.mp4
                name:
                  description: Optional - New name (max 255 chars)
                  type: string
                  example: updated-story-name
                sort_order:
                  description: Optional - New sort order (integer)
                  type: string
                  example: '2'
                status:
                  description: Optional - New status (integer)
                  type: string
                  example: '1'
                title:
                  description: Optional - New title (max 255 chars)
                  type: string
                  example: Updated Story
                ts_end:
                  description: Optional - New end timestamp
                  type: string
                  example: '2024-04-20T00:00:00Z'
                ts_start:
                  description: Optional - New start timestamp
                  type: string
                  example: '2024-03-20T00:00:00Z'
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Story successfully updated
                  status:
                    type: string
                    example: ok
              examples:
                '200':
                  value:
                    message: Story successfully updated
                    status: ok
