openapi: 3.2.0
info:
  title: Storyly External Story API
  version: 1.0.0
  contact: {}
  description: The Storyly External API manages apps, instances, story groups, stories, audiences and segments for Storyly, App Samurai's in-app content experience product. Harvested verbatim from the Storyly ReadMe documentation hub (docs.storyly.io/.well-known/api-catalog -> docs.storyly.io/openapi/68f9ff1ab2a841f03a72b06b).
  x-apievangelist-source: https://docs.storyly.io/openapi/68f9ff1ab2a841f03a72b06b
  x-apievangelist-method: searched
servers:
- url: https://api.storyly.io
tags:
- name: story
  description: Story management endpoints
paths:
  /external/story:
    get:
      tags:
      - story
      summary: Get stories
      description: Get stories in a story group.
      operationId: getStories
      security:
      - bearerAuth: []
      parameters:
      - name: story_group_id
        in: query
        schema:
          type: string
          example: '204206'
        description: required=True, min_value=1
      - name: limit
        in: query
        schema:
          type: string
          example: '1'
        description: required=False, min_value=1, max_value=100
      - name: offset
        in: query
        schema:
          type: string
          example: '0'
        description: required=False, min_value=0
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id:
                          type: number
                          example: 9434
                        button_text:
                          type: string
                          example: ''
                        deep_link:
                          type: string
                          example: jushpl://storyly?g=204206&s=2581651&instance=22896
                        id:
                          type: number
                          example: 2581651
                        media:
                          type: string
                          example: https://db62cod6cnasq.cloudfront.net/user-media/9434/s2581651/3879931866.jpeg
                        media_raw:
                          type: string
                          example: https://db62cod6cnasq.cloudfront.net/user-media/9434/087d26b8-4f90-4707-9fa2-764f289d7717--f99ac6d1f6614ba398ced3cb5a83f329.png
                        mime_type:
                          type: string
                          example: image/jpeg
                        name:
                          example: null
                        outlink:
                          type: string
                          example: ''
                        settings:
                          example: null
                        sort_order:
                          type: number
                          example: 0
                        status:
                          type: number
                          example: 1
                        story_group_id:
                          type: number
                          example: 204206
                        studio_image:
                          type: string
                          example: https://db62cod6cnasq.cloudfront.net/user-media/9434/s2581651/3927707939.jpeg
                        target_cap:
                          example: null
                        thumbnail:
                          example: null
                        title:
                          type: string
                          example: TEST 4
                        ts_created:
                          type: string
                          example: '2025-03-04 17:48:15'
                        ts_end:
                          example: null
                        ts_start:
                          type: string
                          example: '2025-03-04 17:47:47'
                        ts_updated:
                          type: string
                          example: '2025-03-04 17:49:41'
                        type:
                          type: number
                          example: 1
                    example:
                    - account_id: 9434
                      button_text: ''
                      deep_link: jushpl://storyly?g=204206&s=2581651&instance=22896
                      id: 2581651
                      media: https://db62cod6cnasq.cloudfront.net/user-media/9434/s2581651/3879931866.jpeg
                      media_raw: https://db62cod6cnasq.cloudfront.net/user-media/9434/087d26b8-4f90-4707-9fa2-764f289d7717--f99ac6d1f6614ba398ced3cb5a83f329.png
