source: https://www.storyly.io/pricing
notes: >-
  Pricing is published for exactly one of App Samurai's two product lines.
  Storyly lists three suites with two entry prices; the AppSamurai advertising /
  user-acquisition side publishes no pricing page at all
  (https://appsamurai.com/pricing/ returns 404) and routes everything through
  contact-us, which is normal for a managed media business but means an agent
  cannot price it.
  Neither API is priced separately: the Storyly External API and the AppSamurai
  Campaign Spend API are both entitlements of an existing account rather than
  metered products, and no usage quota, overage rate or per-call price is
  published for either. There is no free tier and no self-serve checkout - every
  CTA on the pricing page goes to contact-sales.

