docs: https://docs.storyly.io/docs/storyly-integration-mcp-server
notes: >-
  App Samurai publishes no HTML changelog page and no dated release feed on
  appsamurai.com or storyly.io. The only machine-readable, dated changelog it
  ships is delivered through its own MCP server: the get_release_notes tool
  returns per-platform Storyly Placement SDK release notes with versions and
  DD.MM.YYYY dates. That is an unusual and genuinely agent-first choice - the
  changelog is readable by an agent before it is readable by a human - and the
  entries below are transcribed verbatim from that response.
  Scope caveat: these are SDK release notes. Neither REST API - the Storyly
  External API nor the AppSamurai Campaign Spend API - has any published
  changelog, and neither carries a version in its path.

scheme: semver
scope: Storyly Placement SDK (client libraries), all five platforms
api_changelog: none
api_changelog_note: >-
  No changelog for the Storyly External API (18 operations) or the AppSamurai
  Campaign Spend API. The External API spec pins info.version 1.0.0 and has no
  version segment in its paths.

