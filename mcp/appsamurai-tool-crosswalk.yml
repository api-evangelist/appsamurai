  + openapi/appsamurai-campaign-spend-api-openapi.yml
notes: >-
  The headline finding is that App Samurai's MCP surface and its REST surface do
  not overlap at all. mcp.storyly.io is a DOCUMENTATION server over the Storyly
  Placement SDK - it answers "what is the latest Android SDK version", "how do I
  implement shoppable content", "what changed in 1.12.0". The Storyly External
  API is a CONTENT MANAGEMENT API - it creates story groups, stories, audiences
  and segments. No MCP tool calls any REST operation, and no REST operation is
  reachable from an agent through MCP. Every one of the 18 published operations
  is rest_only. Recorded as measured, not smoothed.

