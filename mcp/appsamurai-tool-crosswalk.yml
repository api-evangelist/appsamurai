mcp_only:
  - tool: get_latest_sdk_version
    reason: >-
      Resolves the published Storyly Placement SDK version from Maven Central /
      SPM. No REST operation exposes SDK release metadata.
  - tool: get_feature_guide
    reason: Serves documentation content from docs.storyly.io; no REST equivalent.
  - tool: get_api_reference
    reason: >-
      Serves SDK symbol reference from integration.storyly.io (Jazzy/Dokka/TypeDoc
      output), not the REST API. No REST equivalent.
  - tool: search_knowledge
    reason: Full-text search over guides and SDK references; no REST search endpoint exists.
  - tool: get_release_notes
    reason: >-
      Serves the SDK changelog. There is no REST changelog operation; this tool
      is in fact the only machine-readable, dated changelog App Samurai publishes
      (see changelog/appsamurai-changelog.yml).

