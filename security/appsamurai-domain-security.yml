notes: >-
  Round 2 added the storyly.io hosts, which is where App Samurai's live API,
  documentation and MCP surfaces actually run. Two findings worth naming.
  First, TLS posture is good almost everywhere - TLSv1.3 and HSTS on every
  storyly.io host that serves a site - but the two API hosts themselves,
  api.appsamurai.com and api.storyly.io, send NO HSTS header, and
  api.appsamurai.com is still on TLSv1.2.
  Second, the AppSamurai Campaign Spend API is DOCUMENTED over cleartext:
  the Help Center article publishes the base URL as
  http://api.appsamurai.com/api/customer-pull/spent/{api_key}, and the API key is
  a path segment. The host does 301 from :80 to TLS, so the credential is not
  necessarily transmitted in the clear, but a documented http:// URL carrying a
  secret in its path is a real defect in the published guidance.
  Neither domain has DNSSEC or a CAA record. Both publish SPF and DMARC;
  appsamurai.com's DMARC policy is p=none (monitor only) and storyly.io's is
  p=quarantine at pct=5, so neither is meaningfully enforcing.

