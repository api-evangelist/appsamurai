notes: >-
  Round 2 widened the probe from the appsamurai.com hosts to the Storyly hosts,
  and found one genuine document: docs.storyly.io serves an RFC 9727
  /.well-known/api-catalog linkset (application/linkset+json) pointing at the
  Storyly External API OpenAPI. That is the only real .well-known document App
  Samurai serves anywhere, and it is the basis for the WellKnown pointer in
  apis.yml.
  Everything else is an absence or a false 200: appsamurai.com 404s every path;
  api.appsamurai.com answers HTTP 500 on every path including its own root;
  dashboard.appsamurai.com, dashboard.storyly.io and help.appsamurai.com answer
  200 with an HTML shell for any path - SPA / help-center catch-alls, not
  documents.
  help.appsamurai.com now 308-redirects to appsamurai.com/help/, so the
  security.txt captured in round 1 (well-known/appsamurai-security.txt) is no
  longer served, and it never belonged to App Samurai in the first place - it is
  Intercom's vendor security.txt, canonical
  https://app.intercom.com/.well-known/security.txt. It is retained only as
  evidence and is explicitly NOT credited to App Samurai; no SecurityTxt pointer
  is emitted.

