aid: appsamurai
name: Appsamurai
description: >-
  AppSamurai (legally Apps Medya Teknoloji A.S., engineering org Netvent) is a global, AI-powered mobile
  app growth platform founded in 2016. It offers user acquisition, retargeting, OEM / on-device app
  discovery, rewarded user acquisition and monetization across one platform, plus Storyly, its AI-powered
  in-app content experience product for mobile commerce, and the Interceptd ad fraud detection product.
  AppSamurai reaches over two billion users across more than 130 countries and works with mobile operators
  and device manufacturers such as Samsung, Xiaomi, Huawei, Oppo and Lenovo. It publishes two APIs. The
  Storyly External API covers 18 operations over apps, instances, story groups, stories, audiences and
  segments, authenticated with a bearer JWT, with a provider-published OpenAPI advertised through an
  RFC 9727 api-catalog on its docs host. The AppSamurai Campaign Spend API is a single keyed HTTP GET
  returning campaign spend reporting. AppSamurai also runs a live remote MCP server at mcp.storyly.io
  serving Storyly Placement SDK knowledge to agents, and ships embeddable Placement widget SDKs for
  Android, iOS, Web, React Native and Flutter. AppSamurai is ISO 27001 certified for information security.
  This profile was surfaced as a 500 Global portfolio company and enriched by the API Evangelist pipeline.
