aid: appsamurai
name: Appsamurai
description: AppSamurai (operated by Netvent) is a global, AI-powered mobile app growth platform founded
  in 2016. It offers user acquisition, retargeting, OEM / on-device app discovery, rewarded user acquisition,
  and monetization across one platform, plus the Storyly in-app stories product and the Interceptd ad
  fraud detection product. AppSamurai reaches over two billion users across more than 130 countries and
  works with mobile operators and device manufacturers such as Samsung, Xiaomi, Huawei, Oppo, and Lenovo.
  For developers and advertisers it publishes mobile ad and attribution SDKs and a Campaign Spend API
  that returns campaign spend reporting data via a keyed HTTP GET request. AppSamurai is ISO 27001 certified
  for information security. This profile was surfaced as a 500 Global portfolio company and enriched by
  the API Evangelist pipeline.
