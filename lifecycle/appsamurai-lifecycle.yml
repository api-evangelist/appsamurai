generated: '2026-08-13'
method: searched
source: >-
  https://status.storyly.io + https://docs.storyly.io/llms.txt +
  https://mcp.storyly.io (get_release_notes) +
  https://help.appsamurai.com/en/articles/11105087-appsamurai-campaign-spend-api
notes: >-
  App Samurai runs a fast, well-documented lifecycle on its SDKs and none at all
  on its APIs. The Storyly Placement SDKs ship monthly with dated, per-platform
  release notes; both REST APIs are unversioned, undated and carry no deprecation
  policy. The React Native and Flutter 1.12.0 releases renamed public structures
  - a breaking change - and were shipped as a MINOR version bump with a doc link
  rather than a major, which is the clearest lifecycle finding here.

versioning:
  apis:
    storyly_external_api:
      scheme: none
      note: >-
        No version segment (/external/...), no version header, no media-type
        versioning. info.version is pinned at 1.0.0.
    appsamurai_campaign_spend_api:
      scheme: none-documented
      note: Path is /api/customer-pull/ with no version segment.
  sdks:
    scheme: semver
    lines:
      - name: Storyly Placement
        current: 1.12.0 / 1.13.0 (web)
        status: active
      - name: Storyly classic
        current: 4.x
        status: maintained
      - name: AppSamurai ads / attribution
        current: '2019-2021 era'
        status: dormant
        note: >-
          react-native-appsamurai-ads last published 0.1.0 in August 2019; the
          Android ad SDK repo last pushed July 2019. See packages/.
    semver_deviation:
      version: 1.12.0 (React Native, Flutter)
      date: '2026-08-05'
      finding: >-
        "renamed public structures to sync with native sdks" is a breaking API
        change released as a minor bump. The provider flagged it in the release
        note and linked the re-integration guide, but semver would require 2.0.0.

deprecation:
  policy_url: null
  sunset_header: false
  deprecation_header: false
  deprecated_operations: []
  note: >-
    No published deprecation or Sunset (RFC 8594) policy on either brand, and no
    operation in either OpenAPI carries `deprecated: true`. Nothing tells a
    consumer how much notice they would get.

sla:
